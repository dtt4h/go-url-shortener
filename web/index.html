<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 500;
    }

    input[type="url"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      display: none;
    }

    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .result-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .result-value {
      word-break: break-all;
      font-size: 14px;
    }

    .result-value a {
      color: #007bff;
      text-decoration: none;
    }

    .result-value a:hover {
      text-decoration: underline;
    }

    .stats {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e0e0e0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    
    <div class="form-group">
      <label for="url">Enter URL</label>
      <input type="url" id="url" placeholder="https://example.com" required>
    </div>
    
    <button id="submit" onclick="shortenUrl()">Shorten URL</button>
    
    <div id="result" class="result">
      <div class="result-label">Short URL:</div>
      <div class="result-value" id="shortUrl"></div>
      
      <div class="stats" id="stats" style="display: none;">
        <div>Clicks: <span id="clicks">0</span></div>
      </div>
    </div>
  </div>

  <script>
    async function shortenUrl() {
      const urlInput = document.getElementById('url');
      const resultDiv = document.getElementById('result');
      const shortUrlDiv = document.getElementById('shortUrl');
      const statsDiv = document.getElementById('stats');
      const clicksSpan = document.getElementById('clicks');
      const submitBtn = document.getElementById('submit');
      
      const originalUrl = urlInput.value.trim();
      
      if (!originalUrl) {
        showError('Please enter a URL');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Loading...';
      
      try {
        const response = await fetch('/api/v1/shorten', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url: originalUrl })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to shorten URL');
        }
        
        shortUrlDiv.innerHTML = `<a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
        clicksSpan.textContent = data.click_count;
        statsDiv.style.display = 'block';
        
        resultDiv.className = 'result success';
        
      } catch (error) {
        showError(error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Shorten URL';
      }
    }
    
    function showError(message) {
      const resultDiv = document.getElementById('result');
      const shortUrlDiv = document.getElementById('shortUrl');
      const statsDiv = document.getElementById('stats');
      
      shortUrlDiv.textContent = message;
      statsDiv.style.display = 'none';
      resultDiv.className = 'result error';
    }
    
    document.getElementById('url').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        shortenUrl();
      }
    });
  </script>
</body>
</html>
