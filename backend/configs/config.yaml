env: "production"

server:
  address: ":8080"

db:
  url: "postgres://postgres:postgres@postgres:5432/url_shortener"
  name: "url_shortener"
  password: "postgres"
  max_opens_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"
  conn_max_idle: "1m"

url:
  base: "http://141.105.66.44:8080"
  code_length: 8
  code_alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  default_ttl: "87600h"

logger:
  level: "info"
  show_path_call: false

cors:
  allowed_origin: "*"